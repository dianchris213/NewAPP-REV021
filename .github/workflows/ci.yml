name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (includes jsx-a11y accessibility rules)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + UI tests (Vitest)
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Smoke test the production build
        run: bun run smoke
